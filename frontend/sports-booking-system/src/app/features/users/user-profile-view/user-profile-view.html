<div class="page">

  <a routerLink="/friends" class="back-link">
    <i class="pi pi-arrow-left"></i>
    <span>Back to friends</span>
  </a>

  @if (loading()) {
    <section class="header-card">
      <p-skeleton shape="circle" size="6rem" />
      <p-skeleton width="35%" height="1.5rem" styleClass="mt-2" />
      <p-skeleton width="20%" height="1rem" styleClass="mt-2" />
    </section>
    <section class="card">
      <p-skeleton width="100%" height="3rem" />
    </section>
  } @else if (notFound()) {
    <section class="state-block">
      <i class="pi pi-user-edit state-icon"></i>
      <p class="state-message">We couldn't find that user.</p>
      <p-button label="Back to friends" icon="pi pi-arrow-left" routerLink="/friends" />
    </section>
  } @else if (profile(); as p) {
    <section class="header-card">
      <div class="avatar-wrap">
        @if (avatarUrl()) {
          <img [src]="avatarUrl()" alt="" class="avatar-img" />
        } @else {
          <div class="avatar-fallback">{{ initials() }}</div>
        }
      </div>

      <h2 class="full-name">{{ p.fullName }}</h2>

      <span class="role-badge" [attr.data-role]="p.role">
        <i class="pi pi-shield"></i>
        {{ p.role }}
      </span>
    </section>

    <section class="card">
      <div class="card-header">
        <h3>Bio</h3>
      </div>
      @if (p.bio) {
        <p class="bio-text">{{ p.bio }}</p>
      } @else {
        <p class="bio-empty">This user hasn't added a bio yet.</p>
      }
    </section>
  }

</div>
